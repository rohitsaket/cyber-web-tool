name: CI

# WTT-P00 CI skeleton (PHASES §19: baseline pipeline green on Windows/macOS/Linux +
# governance audits). Product quality gates/CI integration are P39/P48 concerns.

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint + format check (Biome)
        run: npm run check
      - name: Typecheck (tsc strict)
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests (Vitest)
        run: npm run test:unit

  governance-audits:
    name: governance audits
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/catalog-audit/pyproject.toml
      - name: Install catalog-audit (with dev tooling)
        run: python -m pip install -e "tools/catalog-audit[dev]"
      - name: Ruff lint + format check
        run: |
          cd tools/catalog-audit
          ruff check src tests
          ruff format --check src tests
      - name: mypy (strict)
        run: |
          cd tools/catalog-audit
          mypy src
      - name: pytest (audit tooling units + real-docs integration)
        run: |
          cd tools/catalog-audit
          pytest
      - name: Catalog structural audit (PHASES §92)
        run: wtt-catalog-audit --phases PHASES.md
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build audit tooling
        run: npm run typecheck && npm run build
      - name: Contract ownership registry audit
        run: npm run audit:ownership
      - name: Cross-document terminology audit
        run: npm run audit:terminology
      - name: WTT-P00 tree purity (apps/packages/services are README-only until owning phases)
        run: |
          set -euo pipefail
          stray="$(find apps packages services -type f ! -name README.md)"
          if [ -n "$stray" ]; then
            echo "Files outside owning-phase scope found:"; echo "$stray"; exit 1
          fi
      - name: CHANGELOG carries [Unreleased]
        run: grep -q "## \[Unreleased\]" CHANGELOG.md
      - name: Dependency audit (advisory at P00; blocking posture lands P48)
        continue-on-error: true
        run: npm audit --audit-level=high
